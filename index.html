<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index,follow" />
  <title>Chogoria Cabin | Afrocentric Arts and Crafts</title>
</head>
<body>
  <p id="status">Loading Chogoria Cabin…</p>
  <script>
    const sourceUrl = 'https://raw.githubusercontent.com/jcoderkenya/chogoria-cabin/0d7db8aaf6f98013087bb09233cbb36dcb87499b/index.html.html';
    const assetPaths = {
      'images/exterior.jpg': 'exterior.jpg.jpg',
      'images/bedroom-double.jpg': 'bedroom-double.jpg.jpg',
      'images/bedroom-bunks.jpg': 'bedroom-bunks.jpg.jpg',
      'images/living-room.jpg': 'living-room.jpg.jpg',
      'images/kitchen.jpg': 'kitchen.jpg.jpg',
      'images/garden.jpg': 'garden.jpg.jpg',
      'images/bathroom.jpg': 'bathroom.jpg.jpg',
      'images/tree-shelf.jpg': 'tree-shelf.jpg.jpg',
      'video/cabin-birds.mp4': 'cabin-birds.mp4.mp4'
    };

    fetch(sourceUrl)
      .then((response) => {
        if (!response.ok) throw new Error('Could not load the cabin page. Please try again shortly.');
        return response.text();
      })
      .then((html) => {
        for (const [missingPath, actualPath] of Object.entries(assetPaths)) {
          html = html.replaceAll(missingPath, actualPath);
        }
        document.open();
        document.write(html);
        document.close();
      })
      .catch((error) => {
        document.getElementById('status').textContent = error.message;
      });
  </script>
</body>
</html>
